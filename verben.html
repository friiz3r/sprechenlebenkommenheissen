<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roman &#8211; Verben & Fragen</title>
<style>
body{margin:0;padding:0 0 30px;background:#FAF8F3;font-family:Arial,sans-serif;color:#1C1C1A}
header{background:#fff;border-bottom:1px solid #E0DDD5;padding:12px 16px;text-align:center}
header .sub{font-size:10px;color:#D85A30;letter-spacing:2px;text-transform:uppercase}
header h1{margin:2px 0 0;font-size:20px}
header h1 span{color:#D85A30}
nav{display:flex;gap:6px;padding:10px 12px;background:#fff;border-bottom:1px solid #E0DDD5}
nav button{flex:1;padding:10px 0;border-radius:20px;border:1px solid #E0DDD5;background:#FAF8F3;color:#6B6B65;font-size:13px;font-weight:bold;font-family:Arial,sans-serif;cursor:pointer}
nav button.active{background:#1C1C1A;color:#fff;border-color:#1C1C1A}
.wrap{max-width:560px;margin:0 auto;padding:14px 12px}
h2{font-size:15px;margin:18px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chips button{padding:9px 14px;border-radius:20px;border:1px solid #E0DDD5;background:#fff;font-size:14px;font-family:Arial,sans-serif;cursor:pointer;color:#6B6B65}
.chips button.active{background:#D85A30;border-color:#D85A30;color:#fff}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #E0DDD5;border-radius:12px;overflow:hidden}
td{padding:11px 14px;border-bottom:1px solid #F0EDE5;font-size:16px}
td.p{color:#6B6B65;width:42%}
td b{color:#D85A30}
td.irr{background:#FFF4E5}
.note{font-size:13px;color:#6B6B65;margin:8px 2px}
.qw{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qc{background:#fff;border:1px solid #E0DDD5;border-radius:12px;padding:12px;text-align:center}
.qc .w{font-size:20px;font-weight:bold;color:#185FA5}
.qc .r{font-size:12px;color:#6B6B65;margin:2px 0 6px}
.qc .e{font-size:12px;line-height:1.4}
.bar{height:8px;background:#E0DDD5;border-radius:4px;overflow:hidden;margin:4px 0 12px}
.bar div{height:100%;width:0;background:#1D9E75;transition:width .3s}
.cnt{font-size:13px;color:#6B6B65;text-align:center}
.title{font-size:13px;color:#6B6B65;text-align:center;margin:10px 0}
.qbox{background:#fff;border:1px solid #E0DDD5;border-radius:16px;padding:22px 14px;text-align:center;margin-bottom:12px}
#qText{font-size:24px;font-weight:bold}
.blank{display:inline-block;min-width:50px;border-bottom:3px solid #D85A30;color:#D85A30}
.blank.f{color:#1D9E75;border-color:#1D9E75}
#qHint{font-size:15px;color:#6B6B65;font-style:italic;margin-top:10px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{padding:16px 6px;font-size:18px;font-weight:bold;font-family:Arial,sans-serif;border-radius:12px;border:2px solid #E0DDD5;background:#fff;color:#1C1C1A;cursor:pointer}
.opt.ok{background:#1D9E75;border-color:#1D9E75;color:#fff}
.opt.bad{background:#E24B4A;border-color:#E24B4A;color:#fff}
.opt.dim{opacity:.45}
.fb{min-height:22px;text-align:center;font-weight:bold;margin:12px 0 6px}
.fb.good{color:#0F6E56}
.fb.bad{color:#A32D2D}
#qNext{display:none;width:100%;padding:15px;font-size:16px;font-weight:bold;font-family:Arial,sans-serif;border:none;border-radius:12px;background:#1C1C1A;color:#fff;cursor:pointer}
</style>
</head>
<body>
<header>
  <div class="sub">Lessons with Roman</div>
  <h1>Verben <span>&</span> Fragen</h1>
</header>
<nav>
  <button id="n_learn" onclick="show('learn')">Lernen</button>
  <button id="n_verb" onclick="show('verb')">Verben</button>
  <button id="n_frage" onclick="show('frage')">Fragen</button>
  <button id="n_satz" onclick="show('satz')">S&#228;tze</button>
</nav>

<div class="wrap" id="learn">
  <h2>Verben im Pr&#228;sens</h2>
  <div class="chips" id="vChips"></div>
  <table id="vTable"></table>
  <div class="note" id="vNote"></div>
  <h2>Fragew&#246;rter</h2>
  <div class="qw" id="qwBox"></div>
</div>

<div class="wrap" id="quiz" style="display:none">
  <div class="cnt" id="qCount"></div>
  <div class="bar"><div id="qBar"></div></div>
  <div class="title" id="qTitle"></div>
  <div class="qbox"><div id="qText"></div><div id="qHint"></div></div>
  <div class="opts" id="qOpts"></div>
  <div class="fb" id="qFb"></div>
  <button id="qNext" onclick="nextQ()">Weiter</button>
</div>

<script>
var PRON=["ich","du","er/sie/es","wir","ihr","sie/Sie"];
var VLIST=["sprechen","leben","wohnen","kommen","hei\u00dfen"];
var VERBS={
  "sprechen":["spreche","sprichst","spricht","sprechen","sprecht","sprechen"],
  "leben":["lebe","lebst","lebt","leben","lebt","leben"],
  "wohnen":["wohne","wohnst","wohnt","wohnen","wohnt","wohnen"],
  "kommen":["komme","kommst","kommt","kommen","kommt","kommen"],
  "hei\u00dfen":["hei\u00dfe","hei\u00dft","hei\u00dft","hei\u00dfen","hei\u00dft","hei\u00dfen"]
};
var ENDS=["e","st","t","en","t","en"];
var NOTES={
  "sprechen":"Unregelm\u00e4\u00dfig: e wird zu i bei du und er/sie/es.",
  "leben":"Regelm\u00e4\u00dfig: Stamm leb- + Endung.",
  "wohnen":"Regelm\u00e4\u00dfig: Stamm wohn- + Endung.",
  "kommen":"Regelm\u00e4\u00dfig: Stamm komm- + Endung.",
  "hei\u00dfen":"Bei du nur -t (du hei\u00dft), weil der Stamm auf -\u00df endet."
};
var QW=[
  ["wo","\u0433\u0434\u0435","Ort: Wo wohnst du?"],
  ["woher","\u043e\u0442\u043a\u0443\u0434\u0430","Herkunft: Woher kommst du?"],
  ["was","\u0447\u0442\u043e","Sache: Was sprichst du?"],
  ["wie","\u043a\u0430\u043a","Name, Art: Wie hei\u00dft du?"]
];
var QS=[
  ["___ wohnst du?","wo","\u2013 In Berlin."],
  ["___ kommst du?","woher","\u2013 Aus Russland."],
  ["___ hei\u00dft du?","wie","\u2013 Ich hei\u00dfe Roman."],
  ["___ sprichst du?","was","\u2013 Deutsch und Englisch."],
  ["___ lebt er?","wo","\u2013 In Wien."],
  ["___ kommt sie?","woher","\u2013 Aus Polen."],
  ["___ hei\u00dft sie?","wie","\u2013 Sie hei\u00dft Anna."],
  ["___ sprecht ihr?","was","\u2013 Wir sprechen Deutsch."],
  ["___ wohnt ihr?","wo","\u2013 Wir wohnen in M\u00fcnchen."],
  ["___ kommen Sie?","woher","\u2013 Ich komme aus Italien."],
  ["___ ist das?","was","\u2013 Das ist ein Apfel."],
  ["___ geht es dir?","wie","\u2013 Gut, danke!"],
  ["___ lebst du?","wo","\u2013 Ich lebe in Hamburg."],
  ["___ hei\u00dfen Sie?","wie","\u2013 Ich hei\u00dfe M\u00fcller."]
];
var SATZ=[
  ["Wo ___ du?","wohnen",1,"\u2013 In Berlin."],
  ["Woher ___ er?","kommen",2,"\u2013 Aus Polen."],
  ["Wie ___ sie?","hei\u00dfen",2,"\u2013 Sie hei\u00dft Anna."],
  ["___ ihr Deutsch?","sprechen",4,"\u2013 Ja, ein bisschen."],
  ["Wo ___ ihr?","leben",4,"\u2013 Wir leben in Wien."],
  ["Woher ___ Sie?","kommen",5,"\u2013 Aus Italien."],
  ["Wie ___ Sie?","hei\u00dfen",5,"\u2013 Ich hei\u00dfe M\u00fcller."],
  ["Wo ___ er?","wohnen",2,"\u2013 In K\u00f6ln."],
  ["Was ___ sie?","sprechen",2,"\u2013 Deutsch."],
  ["Woher ___ ihr?","kommen",4,"\u2013 Aus Russland."],
  ["Wie ___ du?","hei\u00dfen",1,"\u2013 Ich hei\u00dfe Roman."],
  ["Wo ___ du?","leben",1,"\u2013 Ich lebe in Hamburg."]
];
var TITLES={
  "verb":"W\u00e4hle die richtige Verbform.",
  "frage":"Welches Fragewort passt?",
  "satz":"Erg\u00e4nze das Verb im Satz."
};

var mode="learn", items=[], pos=0, score=0, locked=false;

function $(i){return document.getElementById(i);}
function shuf(a){var b=a.slice(),i,j,t;for(i=b.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=b[i];b[i]=b[j];b[j]=t;}return b;}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}

function formOpts(v,ans){
  var seen={},d=[],f=VERBS[v],i;
  for(i=0;i<f.length;i++){ if(f[i]!==ans && !seen[f[i]]){seen[f[i]]=1;d.push(f[i]);} }
  d=shuf(d).slice(0,3);
  d.push(ans);
  return shuf(d);
}

function show(m){
  mode=m;
  var ids=["learn","verb","frage","satz"];
  for(var i=0;i<ids.length;i++){ $("n_"+ids[i]).className=(ids[i]===m)?"active":""; }
  $("learn").style.display=(m==="learn")?"block":"none";
  $("quiz").style.display=(m==="learn")?"none":"block";
  if(m!=="learn"){ startQuiz(); }
}

/* ---------- LERNEN ---------- */
function showVerb(v){
  var chips=$("vChips").getElementsByTagName("button"),i;
  for(i=0;i<chips.length;i++){ chips[i].className=(chips[i].getAttribute("data-v")===v)?"active":""; }
  var html="",f=VERBS[v],form,end,irr;
  for(i=0;i<6;i++){
    form=f[i];
    end=ENDS[i];
    irr=false;
    if(v==="hei\u00dfen" && i===1){ end="t"; }
    if(v==="sprechen" && (i===1||i===2)){ irr=true; }
    html+='<tr><td class="p">'+PRON[i]+'</td><td'+(irr?' class="irr"':'')+'>'+form.slice(0,form.length-end.length)+'<b>'+end+'</b></td></tr>';
  }
  $("vTable").innerHTML=html;
  $("vNote").textContent=NOTES[v];
}
function initLearn(){
  var box=$("vChips"),i,b;
  for(i=0;i<VLIST.length;i++){
    b=document.createElement("button");
    b.textContent=VLIST[i];
    b.setAttribute("data-v",VLIST[i]);
    b.onclick=function(){ showVerb(this.getAttribute("data-v")); };
    box.appendChild(b);
  }
  var h="";
  for(i=0;i<QW.length;i++){
    h+='<div class="qc"><div class="w">'+QW[i][0]+'</div><div class="r">'+QW[i][1]+'</div><div class="e">'+QW[i][2]+'</div></div>';
  }
  $("qwBox").innerHTML=h;
  showVerb("sprechen");
}

/* ---------- QUIZ ---------- */
function build(m){
  var out=[],i,j,v,a,pool;
  if(m==="verb"){
    pool=[];
    for(i=0;i<VLIST.length;i++){
      v=VLIST[i];
      for(j=0;j<6;j++){
        a=VERBS[v][j];
        pool.push({q:PRON[j]+" ___ ("+v+")",hint:"",ans:a,opts:formOpts(v,a)});
      }
    }
    out=shuf(pool).slice(0,10);
  } else if(m==="frage"){
    pool=shuf(QS).slice(0,10);
    for(i=0;i<pool.length;i++){
      out.push({q:pool[i][0],hint:pool[i][2],ans:pool[i][1],opts:["wo","woher","was","wie"]});
    }
  } else {
    pool=shuf(SATZ).slice(0,10);
    for(i=0;i<pool.length;i++){
      a=VERBS[pool[i][1]][pool[i][2]];
      out.push({q:pool[i][0],hint:pool[i][3],ans:a,opts:formOpts(pool[i][1],a)});
    }
  }
  return out;
}
function startQuiz(){
  items=build(mode);
  pos=0; score=0;
  $("qTitle").textContent=TITLES[mode];
  renderQ();
}
function renderQ(){
  locked=false;
  var n=items.length;
  if(pos>=n){ finish(); return; }
  var it=items[pos],i,b;
  $("qCount").textContent=(pos+1)+" / "+n+"  \u00b7  Punkte: "+score;
  $("qBar").style.width=(pos/n*100)+"%";
  $("qText").innerHTML=it.q.replace("___",'<span class="blank" id="blank">___</span>');
  $("qHint").textContent=it.hint;
  $("qFb").textContent=""; $("qFb").className="fb";
  $("qNext").style.display="none";
  var box=$("qOpts"); box.innerHTML="";
  for(i=0;i<it.opts.length;i++){
    b=document.createElement("button");
    b.className="opt";
    b.textContent=it.opts[i];
    b.setAttribute("data-v",it.opts[i]);
    b.onclick=answer;
    box.appendChild(b);
  }
}
function answer(){
  if(locked){ return; }
  locked=true;
  var it=items[pos], v=this.getAttribute("data-v"), ok=(v===it.ans), i, bs=$("qOpts").getElementsByTagName("button");
  for(i=0;i<bs.length;i++){
    if(bs[i].getAttribute("data-v")===it.ans){ bs[i].className="opt ok"; }
    else if(bs[i]===this){ bs[i].className="opt bad"; }
    else { bs[i].className="opt dim"; }
  }
  var fill=(it.q.indexOf("___")===0)?cap(it.ans):it.ans;
  $("blank").textContent=fill;
  $("blank").className="blank f";
  if(ok){ score++; $("qFb").textContent="Richtig! \u2713"; $("qFb").className="fb good"; }
  else { $("qFb").textContent="Nicht ganz \u2013 richtig: "+it.ans; $("qFb").className="fb bad"; }
  $("qNext").textContent=(pos+1>=items.length)?"Ergebnis":"Weiter";
  $("qNext").style.display="block";
}
function nextQ(){
  if(pos>=items.length){ startQuiz(); return; }
  pos++;
  renderQ();
}
function finish(){
  var n=items.length;
  $("qBar").style.width="100%";
  $("qCount").textContent="Fertig!";
  $("qText").textContent=score+" von "+n+" richtig";
  $("qHint").textContent=(score===n)?"Perfekt! Ausgezeichnet, Roman!":(score>=n*0.7)?"Sehr gut! Weiter so!":"Noch einmal \u00fcben \u2013 du schaffst das!";
  $("qOpts").innerHTML="";
  $("qFb").textContent="";
  $("qNext").textContent="Nochmal";
  $("qNext").style.display="block";
}

initLearn();
show("learn");
</script>
</body>
</html>
